<div class="max-w-2xl mx-auto space-y-6 py-6">
    <div>
        <h1 class="text-3xl font-extrabold text-text tracking-tight">Settings</h1>
        <p class="text-sm text-muted mt-1">Manage your account preferences and app configurations.</p>
    </div>

    <div class="bg-white rounded-3xl border border-border divide-y divide-border shadow-2xs overflow-hidden">



        <!-- 2. Change Password Navigation (رابط حقيقي يغطي الكارد كله) -->
        <a routerLink="/changePassword"
            class="p-5 flex items-center justify-between hover:bg-background transition-colors cursor-pointer group">
            <div class="flex items-center gap-3.5">
                <div
                    class="w-10 h-10 rounded-2xl bg-surface text-primary flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors">
                    <i class="fa-solid fa-key text-sm"></i>
                </div>
                <div>
                    <h4 class="font-bold text-sm text-text group-hover:text-primary transition-colors">Change password
                    </h4>
                    <p class="text-xs text-muted">Keep your account secure with a new password</p>
                </div>
            </div>
            <i
                class="fa-solid fa-chevron-right text-xs text-muted group-hover:translate-x-0.5 transition-transform"></i>
        </a>

        <!-- 3. Dark Mode Toggle Button (زر تفاعلي حقيقي) -->
        <button type="button" (click)="toggleDarkMode()"
            class="w-full p-5 flex items-center justify-between hover:bg-background transition-colors cursor-pointer text-left group">
            <div class="flex items-center gap-3.5">
                <div
                    class="w-10 h-10 rounded-2xl bg-surface text-primary flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors">
                    <i class="fa-solid fa-moon text-sm"></i>
                </div>
                <div>
                    <h4 class="font-bold text-sm text-text group-hover:text-primary transition-colors">Dark mode</h4>
                    <p class="text-xs text-muted">Switch between light and dark themes</p>
                </div>
            </div>
            <i class="fa-solid fa-circle-half-stroke text-sm text-muted"></i>
        </button>

    </div>
</div>
