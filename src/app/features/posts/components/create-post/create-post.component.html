<div class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-extrabold text-text tracking-tight">Create post</h1>
            <p class="text-sm text-muted mt-1">Share a moment, a thought, or an update with your circle.</p>
        </div>
        <a routerLink="/home"
            class="w-10 h-10 rounded-full bg-white border border-border flex items-center justify-center text-muted hover:text-text transition-colors shadow-2xs cursor-pointer">
            <i class="fa-solid fa-xmark text-base"></i>
        </a>
    </div>

    <!-- Create Post Card Form -->
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()"
        class="bg-white p-6 sm:p-8 rounded-3xl border border-border space-y-6 shadow-2xs">

        <!-- User Info -->
        <div class="flex items-center gap-3">
            <img [src]="currentUser?.photo || '/assets/sociafy-default-profile-avatar.png'"
                class="w-12 h-12 rounded-full object-cover shrink-0 border border-border" alt="User avatar" />
            <div>
                <h3 class="font-bold text-sm text-text">{{ currentUser?.name || 'User Name' }}</h3>
                <span
                    class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-background text-primary text-[11px] font-semibold mt-0.5">
                    <i class="fa-solid fa-earth-americas text-[9px]"></i> Public
                </span>
            </div>
        </div>

        <!-- Textarea Input -->
        <div class="space-y-2">
            <textarea rows="5" formControlName="body"
                [placeholder]="'What\'s on your mind, ' + (currentUser?.name || 'User') + '?'"
                class="w-full bg-surface border border-border rounded-2xl p-4 text-sm text-text placeholder:text-muted focus:outline-none focus:border-primary transition-colors resize-none"></textarea>
        </div>

        <!-- Media Upload Box Preview / File Picker -->
        <label
            class="border-2 border-dashed border-border rounded-2xl p-6 text-center bg-surface hover:border-primary/50 transition-colors cursor-pointer group block">
            <input type="file" (change)="onFileSelected($event)" class="hidden" accept="image/*" />
            <div
                class="w-12 h-12 rounded-full bg-background text-primary flex items-center justify-center mx-auto mb-3 group-hover:scale-105 transition-transform">
                <i class="fa-regular fa-image text-xl"></i>
            </div>
            <h4 class="font-bold text-sm text-text">
                @if (selectedFile) {
                <span class="text-primary truncate block max-w-xs mx-auto">{{ selectedFile.name }}</span>
                } @else {
                Add photo
                }
            </h4>
            <p class="text-xs text-muted mt-1">Drag and drop or click to browse files</p>
        </label>

        @if (selectedFile) {
        <div
            class="flex items-center justify-between bg-surface px-4 py-2 rounded-xl text-xs text-primary border border-border">
            <span class="truncate"><i class="fa-solid fa-image mr-1.5"></i> Selected: {{ selectedFile.name }}</span>
            <button type="button" (click)="selectedFile = null" class="text-muted hover:text-red-500 cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
        }

        <!-- Submit Button -->
        <button type="submit" [disabled]="postForm.invalid || isSubmitting"
            class="w-full py-3.5 px-4 bg-primary hover:bg-primary-hover disabled:opacity-50 text-white font-semibold text-sm rounded-xl transition-colors shadow-md flex items-center justify-center gap-2 cursor-pointer">
            @if (isSubmitting) {
            <i class="fa-solid fa-spinner fa-spin text-xs"></i> Publishing...
            } @else {
            Publish post <i class="fa-solid fa-arrow-right text-xs"></i>
            }
        </button>

    </form>
</div>
