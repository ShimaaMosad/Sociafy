<div class="min-h-screen bg-white flex flex-col justify-between selection:bg-primary selection:text-white">

    <app-auth-header></app-auth-header>

    <main

                </div>

                <h1 class="text-5xl xl:text-6xl font-extrabold text-primary-dark leading-[1.08] tracking-tight">
                    Your people.<br />
                    <span class="text-primary">Your place.</span>
                </h1>

                <p class="text-muted mt-4 text-base leading-relaxed max-w-md">

                </p>
            </div>

            <div class="relative my-8 mx-auto w-full max-w-[460px]">

                <div
                    class="absolute -top-6 -left-6 bg-white rounded-2xl p-4 shadow-lg flex items-center gap-3 -rotate-6 z-10">

                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-primary-dark">You belong here.</h3>
                        <p class="text-muted text-xs mt-0.5">Your kind of people are waiting.</p>
                    </div>
                </div>

                <div class="absolute -right-4 top-4 bg-lime p-4 rounded-2xl rotate-12 text-primary shadow-sm z-10">

                <div

                <div class="absolute -bottom-14 -right-4 bg-white rounded-2xl p-5 shadow-xl rotate-6 w-56 z-10">

                    <div class="flex justify-between items-center mt-3">

                        <div class="bg-lime text-primary-dark rounded-full w-6 h-6 flex items-center justify-center">

                    </div>

        <div class="lg:col-span-6 flex items-center justify-center py-6 px-2 sm:px-8 w-full">
