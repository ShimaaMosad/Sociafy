<footer class="hidden lg:flex justify-between items-center px-12 py-6 text-xs text-muted border-t border-border/40">
    <p>Â© 2026 Socialapp. A little more connected.</p>

    <div class="flex items-center gap-6">
        <div class="relative">

            <button type="button" (click)="toggleDropdown($event)"
                class="flex items-center gap-1.5 cursor-pointer hover:text-primary transition-colors focus:outline-none">
                <i class="fa-solid fa-globe"></i>
                <span>{{ currentLanguage }}</span>
                <i class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200"
                    [class.rotate-180]="isDropdownOpen"></i>
            </button>

            @if (isDropdownOpen) {
            <div
                class="absolute bottom-full mb-2 right-0 w-36 bg-white border border-border rounded-2xl shadow-lg py-2 z-50 overflow-hidden animate-in fade-in zoom-in-95 duration-150">

                <button type="button" (click)="selectLanguage('English')"
                    class="w-full text-left px-4 py-2.5 text-xs font-semibold flex items-center justify-between hover:bg-background transition-colors cursor-pointer"
                    [class.text-primary]="currentLanguage === 'English'"
                    [class.text-text]="currentLanguage !== 'English'">
                    <span>English</span>
                    @if (currentLanguage === 'English') {
                    <i class="fa-solid fa-check text-[10px]"></i>
                    }
                </button>

                <button type="button" (click)="selectLanguage('Arabic')"
                    class="w-full text-left px-4 py-2.5 text-xs font-semibold flex items-center justify-between hover:bg-background transition-colors cursor-pointer"
                    [class.text-primary]="currentLanguage === 'Arabic'"
                    [class.text-text]="currentLanguage !== 'Arabic'">
                    <span>Ø§Ù„Ø¹Ø±Ø¨ÙŠØ©</span>
                    @if (currentLanguage === 'Arabic') {
                    <i class="fa-solid fa-check text-[10px]"></i>
                    }
                </button>

            </div>
            }

        </div>
    </div>
</footer>
