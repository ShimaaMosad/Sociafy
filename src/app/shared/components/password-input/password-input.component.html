<div class="relative rounded-xl border border-border bg-white
         focus-within:border-primary focus-within:ring-2
         focus-within:ring-primary/25 transition-all">

    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center
              pointer-events-none text-muted">
        <i class="fa-solid fa-lock text-sm"></i>
    </div>

    <input [id]="id" [type]="showPassword ? 'text' : 'password'" [placeholder]="placeholder" [formControl]="control"
        autocomplete="new-password" class="w-full pl-10 pr-10 py-2.5 bg-transparent text-sm
           text-text placeholder:text-muted focus:outline-none rounded-xl" />

    <button type="button" (click)="togglePasswordVisibility()"
        class="absolute inset-y-0 right-0 px-3.5 flex items-center text-muted hover:text-primary"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">

        <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
    </button>

</div>
